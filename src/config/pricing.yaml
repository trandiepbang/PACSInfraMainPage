# Single source of truth for every price, tier, banner and pricing FAQ on the site.
# Validated by src/config/schema.ts at build time: a typo or unknown key fails the build.
# Cards have no buttons: one "Contact us" button sits under them on /pricing.
# Prices are numbers; they are formatted from `currency` + `price` (e.g. 2500 -> $2,500).
# The layout supports 1 to 3 tiers, rendered in the order listed here.

currency: USD

foundingOffer:
  enabled: false
  text: "Founding customers: the first 3 organisations get 50% off in exchange for a case study."

tiers:
  - id: self-hosted
    name: Self-Hosted
    price: 2500
    billing: one-time        # one-time | yearly | monthly
    highlight: false
    description: Source code you run yourself.
    features:
      - Full source code, lifetime licence for one organisation
      - 12 months of updates
      - Installation docs (Docker Compose)
      - 12 months of email support (reply within 2 business days)
    renewal: 900               # per year, after the first 12 months; shown on the card and in /terms

  - id: deployed
    name: Deployed
    price: 6000
    billing: one-time
    highlight: true
    badge: Most popular
    description: We deploy it, hand it over to your team and support it for a year.
    features:
      - Everything in Self-Hosted
      - Deployed end to end on your server, cloud or Kubernetes cluster
      - Handover to your team, with a walkthrough
      - 12 months of support and updates
    renewal: 1500

# Integration work (connecting PACSinfra to other systems), sold as an add-on per day.
# Leave it out to show [PLACEHOLDER] on /pricing until the rate is decided.
# integrationDayRate: 800

licenceSummary: >
  One organisation per licence. You may modify the code. You may not resell or redistribute it.

faq:
  - q: What do updates include?
    a: Bug fixes and new releases for 12 months from your purchase date. Every version you receive is yours to keep and run for as long as you like.
  - q: What does support cover?
    a: Help using PACSinfra as delivered, by email, with a best-effort reply within 2 business days (Taiwan time). Custom development, integration with your other systems and on-site work are separate paid services, quoted individually.
  - q: What is your refund policy?
    a: Because you receive the full source code, refunds are not available once you have received it, except where required by law. There are a few exceptions, such as orders not yet delivered, payments made in error, deployments before work starts and renewals cancelled within 14 days; see the refund policy for details. Try the live demo first, or email me with any questions before you buy.
  - q: Can we pay by invoice or bank transfer?
    a: Yes. Payment is by invoice and bank transfer, on the terms stated in the invoice.
  - q: What happens after 12 months?
    a: You keep the software and every version you have received, and you can keep running it. To continue receiving support and updates, renew each year at the price shown on each plan.
