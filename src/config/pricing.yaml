# Single source of truth for every price, tier, banner and pricing FAQ on the site.
# Validated by src/config/schema.ts at build time: a typo or unknown key fails the build.
# Cards have no buttons: one "Contact us" button sits under them on /pricing.
# Prices are numbers; they are formatted from `currency` + `price` (e.g. 2500 -> $2,500).
# The layout supports 1 to 3 tiers, rendered in the order listed here.

currency: USD

foundingOffer:
  enabled: false
  text: "Founding customers: the first 3 organisations get 50% off in exchange for a case study."

tiers:
  - id: self-hosted
    name: Self-Hosted, first year
    price: 2000
    billing: one-time        # one-time | yearly | monthly
    highlight: true
    callout: DICOM viewer, reports, voice dictation, share links and live chat, all for $2,000
    description: We set it up on your server, hand the full source code over to your team, and look after it for a year.
    features:
      - Every feature included - DICOM viewer, radiology reports with voice dictation, share links and live chat with patients
      - Set up on your own server, cloud or Kubernetes cluster
      - Handover of the full source code to your team, with a walkthrough
      - Lifetime licence for one organisation
      - 12 months of maintenance, debugging and fixes for any error
    renewal: 1000              # per year, after the first 12 months; shown on the card and in /terms

# Sold on top of a plan, shown under the cards on /pricing and on the home page.
addOn:
  name: DICOM node connector and worklist
  price: 1000
  description: A DICOM node inside your hospital network that receives studies from your modalities and existing PACS and forwards them over an encrypted connection, plus a modality worklist. Set up and connected for you.

licenceSummary: >
  One organisation per licence. You may modify the code. You may not resell or redistribute it.

faq:
  - q: What do updates include?
    a: Bug fixes and new releases for 12 months from your purchase date. Every version you receive is yours to keep and run for as long as you like.
  - q: What does maintenance cover?
    a: Debugging and fixing any error in PACSinfra as delivered, plus updates and help by email, with a best-effort reply within 2 business days (Taiwan time). Custom development, integration with your other systems and on-site work are separate paid services, quoted individually.
  - q: What is your refund policy?
    a: Because you receive the full source code, refunds are not available once you have received it, except where required by law. There are a few exceptions, such as orders not yet delivered, payments made in error, setup before work starts and renewals cancelled within 14 days; see the refund policy for details. Try the live demo first, or email me with any questions before you buy.
  - q: How much does data migration cost?
    a: It is quoted per project. The cost depends on how many studies you have, which PACS or archive they are in now and how clean the data is, so I look at your system first and then give you a fixed quote. Like everything else, migration runs inside your own infrastructure.
  - q: Can we pay by invoice or bank transfer?
    a: Yes. Payment is by invoice and international bank transfer in US dollars. For the first-year plan, half is invoiced when you order and half at handover.
  - q: What happens after 12 months?
    a: You keep the software and every version you have received, and you can keep running it. To keep maintenance, debugging and updates going, renew each year at the price shown on the plan.
