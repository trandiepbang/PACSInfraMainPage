# Single source of truth for every price, tier, banner and pricing FAQ on the site.
# Validated by src/config/schema.ts at build time: a typo or unknown key fails the build.
# Cards have no buttons: one "Contact us" button sits under them on /pricing.
# Prices are numbers; they are formatted from `currency` + `price` (e.g. 2500 -> $2,500).
# The layout supports 1 to 3 tiers, rendered in the order listed here.

currency: USD

foundingOffer:
  enabled: false
  text: "Founding customers: the first 3 organisations get 50% off in exchange for a case study."

tiers:
  - id: self-hosted
    name: Self-Hosted
    price: 2500
    billing: one-time        # one-time | yearly | monthly
    highlight: false
    description: Source code you run yourself.
    features:
      - Full source code, lifetime licence for one organisation
      - Lifetime updates
      - Installation docs (Docker Compose)
      - 12 months email support (business-day response)
    note: "After year 1: optional support renewal $900/year"

  - id: deployed
    name: Deployed
    price: 6000
    billing: one-time
    highlight: true
    badge: Most popular
    description: We deploy it, hand it over to your team and support it for a year.
    features:
      - Everything in Self-Hosted
      - Deployed end to end on your server, cloud or Kubernetes cluster
      - Handover to your team, with a walkthrough
      - 12 months of support and updates
    note: "After year 1: optional support renewal $1,500/year"

# Integration work (connecting PACSinfra to other systems), sold as an add-on per day.
# Leave it out to show [PLACEHOLDER] on /pricing until the rate is decided.
# integrationDayRate: 800

licenceSummary: >
  One organisation per licence. You may modify the code. You may not resell or redistribute it.

faq:
  - q: What does "lifetime updates" mean?
    a: TODO
  - q: What does support cover?
    a: TODO
  - q: What is your refund policy?
    a: TODO
  - q: Can we pay by invoice or bank transfer?
    a: TODO
  - q: What happens after 12 months?
    a: TODO
